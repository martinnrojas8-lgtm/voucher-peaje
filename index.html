<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voucher + Peajes</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #111; color: #eee; padding: 12px; padding-bottom: 40px;
  }
  h1 { font-size: 18px; margin: 0 0 12px; text-align: center; }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin-bottom: 16px; position: sticky; top: 0; background: #111; padding: 8px 0; z-index: 10;
  }
  .btn {
    background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; transition: background .15s;
  }
  .btn:active { background: #3a3a3a; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; }
  .btn.danger  { background: #b3261e; border-color: #b3261e; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* HOJA (lo que se captura) */
  #sheet {
    background: #fff; color: #000; width: 100%; max-width: 800px;
    margin: 0 auto; padding: 16px; border-radius: 6px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #sheet .empty { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }
  .item { width: 100%; display: flex; flex-direction: column; }
  .item img { width: 100%; display: block; border-radius: 4px; }
  .item.voucher img { border: 1px solid #eee; }
  .peaje-label {
    font-size: 12px; font-weight: 700; color: #444; margin-bottom: 4px;
    border-bottom: 1px solid #eee; padding-bottom: 2px;
  }
  .sep { height: 1px; background: #eee; margin: 4px 0; }

  /* Modo captura: oculta todo menos la hoja */
  body.capture .toolbar, body.capture h1 { display: none; }
  body.capture { background: #fff; padding: 0; }
  body.capture #sheet { border-radius: 0; max-width: 100%; padding: 8px; }

  .hint { text-align: center; font-size: 12px; color: #888; margin-top: 12px; }
</style>
</head>
<body>

<h1>📄 Voucher + Peajes</h1>

<div class="toolbar">
  <label class="btn primary">
    📸 Voucher AR
    <input type="file" id="voucherInput" accept="image/*" capture="environment" hidden>
  </label>
  <label class="btn primary">
    ➕ Peajes TelePASE
    <input type="file" id="peajesInput" accept="image/*" multiple hidden>
  </label>
  <button class="btn" id="captureBtn">🖼️ Modo captura</button>
  <button class="btn" id="shareBtn" disabled>📤 Compartir</button>
  <button class="btn danger" id="clearBtn">🗑️ Limpiar</button>
</div>

<div id="sheet">
  <div class="empty">Subí el voucher y los peajes para verlos acá 👆</div>
</div>

<div class="hint">Todo se procesa en tu celular. Nada se sube a internet. 🔒</div>

<script>
// ---------- Utilidades ----------
const sheet = document.getElementById('sheet');
const voucherInput = document.getElementById('voucherInput');
const peajesInput = document.getElementById('peajesInput');
const clearBtn = document.getElementById('clearBtn');
const captureBtn = document.getElementById('captureBtn');
const shareBtn = document.getElementById('shareBtn');

let voucherData = null;   // dataURL del voucher
let peajesData = [];      // array de dataURLs

// ---------- Auto-recorte de bordes blancos ----------
function autocrop(dataURL) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, c.width, c.height).data;

      // Umbral: pixel "blanco" si R,G,B > 240
      const thr = 240;
      let top = 0, bottom = c.height - 1, left = 0, right = c.width - 1;
      const isWhite = (x, y) => {
        const i = (y * c.width + x) * 4;
        return data[i] > thr && data[i+1] > thr && data[i+2] > thr;
      };

      // top
      outer: for (; top < c.height; top++)
        for (let x = 0; x < c.width; x++) if (!isWhite(x, top)) break outer;
      // bottom
      outer: for (; bottom > top; bottom--)
        for (let x = 0; x < c.width; x++) if (!isWhite(x, bottom)) break outer;
      // left
      outer: for (; left < c.width; left++)
        for (let y = top; y <= bottom; y++) if (!isWhite(left, y)) break outer;
      // right
      outer: for (; right > left; right--)
        for (let y = top; y <= bottom; y++) if (!isWhite(right, y)) break outer;

      // Margen de seguridad
      const pad = 4;
      top = Math.max(0, top - pad);
      bottom = Math.min(c.height - 1, bottom + pad);
      left = Math.max(0, left - pad);
      right = Math.min(c.width - 1, right + pad);

      const w = right - left + 1;
      const h = bottom - top + 1;
      if (w <= 0 || h <= 0) return resolve(dataURL);

      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      out.getContext('2d').drawImage(img, left, top, w, h, 0, 0, w, h);
      resolve(out.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = () => resolve(dataURL);
    img.src = dataURL;
  });
}

// ---------- Lectura de archivos ----------
function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ---------- Render ----------
function render() {
  sheet.innerHTML = '';
  if (!voucherData && peajesData.length === 0) {
    sheet.innerHTML = '<div class="empty">Subí el voucher y los peajes para verlos acá 👆</div>';
    shareBtn.disabled = true;
    return;
  }

  if (voucherData) {
    const div = document.createElement('div');
    div.className = 'item voucher';
    const img = document.createElement('img');
    img.src = voucherData;
    div.appendChild(img);
    sheet.appendChild(div);
  }

  peajesData.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'item peaje';
    const label = document.createElement('div');
    label.className = 'peaje-label';
    label.textContent = `Peaje ${i + 1}`;
    const img = document.createElement('img');
    img.src = url;
    div.appendChild(label);
    div.appendChild(img);
    sheet.appendChild(div);
  });

  shareBtn.disabled = false;
}

// ---------- Eventos ----------
voucherInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const raw = await fileToDataURL(file);
  voucherData = await autocrop(raw);
  render();
  voucherInput.value = '';
});

peajesInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  for (const f of files) {
    const raw = await fileToDataURL(f);
    peajesData.push(await autocrop(raw));
  }
  render();
  peajesInput.value = '';
});

clearBtn.addEventListener('click', () => {
  if (!confirm('¿Borrar todo?')) return;
  voucherData = null;
  peajesData = [];
  render();
});

captureBtn.addEventListener('click', () => {
  document.body.classList.toggle('capture');
  captureBtn.textContent = document.body.classList.contains('capture')
    ? '✖️ Salir captura'
    : '🖼️ Modo captura';
  window.scrollTo(0, 0);
});

// ---------- Compartir como imagen ----------
shareBtn.addEventListener('click', async () => {
  shareBtn.disabled = true;
  shareBtn.textContent = '⏳ Generando...';
  try {
    const canvas = await htmlToCanvas();
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'voucher-peajes.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: 'Voucher + Peajes' });
        } catch (err) { /* usuario canceló */ }
      } else {
        // Fallback: descarga
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'voucher-peajes.png';
        a.click();
      }
      shareBtn.disabled = false;
      shareBtn.textContent = '📤 Compartir';
    }, 'image/png');
  } catch (err) {
    alert('No se pudo generar la imagen. Probá con el Modo captura + captura de pantalla.');
    shareBtn.disabled = false;
    shareBtn.textContent = '📤 Compartir';
  }
});

// ---------- htmlToCanvas casero (sin librerías) ----------
async function htmlToCanvas() {
  const items = Array.from(sheet.querySelectorAll('.item'));
  if (items.length === 0) throw new Error('Nada para exportar');

  // Ancho fijo de salida
  const W = 800;
  const gap = 12;

  // Cargar todas las imágenes y calcular alturas proporcionales
  const imgs = await Promise.all(items.map(async (it) => {
    const img = it.querySelector('img');
    const el = new Image();
    el.src = img.src;
    await el.decode();
    const labelH = it.querySelector('.peaje-label') ? 22 : 0;
    const h = Math.round((el.naturalHeight / el.naturalWidth) * W);
    return { el, h, labelH };
  }));

  const totalH = imgs.reduce((acc, o) => acc + o.h + o.labelH + gap, 0) + gap;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = totalH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, totalH);

  let y = gap;
  for (const o of imgs) {
    if (o.labelH) {
      ctx.fillStyle = '#444';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('Peaje', 4, y + 14);
      y += o.labelH;
    }
    ctx.drawImage(o.el, 0, y, W, o.h);
    y += o.h + gap;
  }
  return canvas;
}

render();
</script>
</body>
</html>
